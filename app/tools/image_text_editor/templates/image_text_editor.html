{% extends "base.html" %}
{% from "components/icons.html" import icon %}
{% block title %}{{ tr('圖片文字編輯') }} · {{ app_name }}{% endblock %}
{% block content %}
<h1>{{ icon('image', size=22) }} {{ tr('圖片文字編輯') }}</h1><p class="muted">{{ tr('OCR 辨識後可修改文字、字型、大小、顏色與粗體，並即時預覽。') }}</p>
<div class="panel ite-toolbar"><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff"><label>{{ tr('OCR 語言') }} <input id="langs" value="chi_tra+eng"></label><button class="btn btn-primary" id="analyze">{{ tr('上傳並分析') }}</button><span id="status" class="muted"></span></div>
<div class="panel ite-card" id="editor" hidden><div class="ite-preview"><div class="ite-stage"><img id="preview" alt="preview"></div><div class="muted ite-meta"><span id="meta"></span><span id="previewState">{{ tr('原始預覽') }}</span></div></div><div class="ite-words" id="words"></div></div>
<div class="panel" id="actions" hidden><button class="btn" id="resetBtn">{{ tr('重設全部修改') }}</button> <button class="btn btn-primary" id="exportBtn">{{ tr('下載修改後圖片') }}</button></div>
<style nonce="{{ request.state.csp_nonce }}">.ite-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ite-card{display:grid;grid-template-columns:minmax(280px,1fr) minmax(420px,1fr);gap:16px}.ite-preview{overflow:auto;background:#f8fafc;border:1px solid var(--border);padding:8px}.ite-stage{position:relative;display:inline-block;max-width:100%;line-height:0}.ite-stage img{display:block;max-width:100%;height:auto}.ite-box{position:absolute;box-sizing:border-box;border:2px solid #2563eb;background:rgba(37,99,235,.08);cursor:pointer;min-width:3px;min-height:3px}.ite-box.active{border-width:3px;background:rgba(37,99,235,.18);z-index:2}.ite-box.changed{border-color:#ea580c}.ite-meta{margin-top:8px;display:flex;gap:10px}.ite-words{max-height:680px;overflow:auto}.ite-row{border-bottom:1px solid var(--border);padding:8px}.ite-main,.ite-style{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ite-main input{flex:1;min-width:120px}.ite-style{margin-top:6px}.ite-size{width:72px}.ite-color{width:42px;height:34px;padding:2px}.ite-row small{display:block;color:#64748b;margin-top:4px}.ite-row.active{outline:2px solid #2563eb;outline-offset:-2px}.ite-row.changed{background:rgba(234,88,12,.06)}.font-picker{position:relative;display:inline-block;min-width:190px}.font-picker>select{display:none}.font-trigger{width:100%;min-height:34px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 9px;cursor:pointer}.font-pop{position:absolute;z-index:50;top:calc(100% + 4px);left:0;width:300px;max-height:340px;display:flex;flex-direction:column;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.18);overflow:hidden}.font-search-row{padding:8px;border-bottom:1px solid #e2e8f0}.font-search{width:100%;box-sizing:border-box;padding:7px 9px}.font-list{overflow:auto}.font-group{padding:5px 9px;background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:12px}.font-item{padding:7px 10px;cursor:pointer}.font-item:hover,.font-item.active{background:#eff6ff}.font-empty{padding:10px;color:#64748b}@media(max-width:900px){.ite-card{grid-template-columns:1fr}}</style>
<script nonce="{{ request.state.csp_nonce }}">
let uploadId=null,data=null,previewTimer=null,previewUrl=null,previewSeq=0;const $=s=>document.querySelector(s);function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}async function err(r,f){const t=await r.text();try{return JSON.parse(t).detail||f}catch{return t||f}}
function fontGroup(name){return /noto|cjk/i.test(name)?'{{ tr("開源 CJK 字型") }}':'{{ tr("西文開源字型") }}'}
function enhanceFontSelect(select){const wrap=document.createElement('span');wrap.className='font-picker';select.parentNode.insertBefore(wrap,select);wrap.appendChild(select);wrap.insertAdjacentHTML('beforeend',`<button type="button" class="font-trigger"><span class="font-cur">Auto</span><span>▾</span></button><div class="font-pop" hidden><div class="font-search-row"><input type="search" class="font-search" placeholder="{{ tr('搜尋字型名稱…') }}"></div><div class="font-list"></div></div>`);const trigger=wrap.querySelector('.font-trigger'),pop=wrap.querySelector('.font-pop'),search=wrap.querySelector('.font-search'),list=wrap.querySelector('.font-list');function draw(){const q=search.value.trim().toLowerCase(),fonts=[...(data.fonts||[])].filter(f=>!q||f.name.toLowerCase().includes(q));let html=`<div class="font-item${select.value===''?' active':''}" data-value="">Auto</div>`;['{{ tr("開源 CJK 字型") }}','{{ tr("西文開源字型") }}'].forEach(g=>{const items=fonts.filter(f=>fontGroup(f.name)===g);if(items.length){html+=`<div class="font-group">${g}</div>`+items.map(f=>`<div class="font-item${select.value===f.value?' active':''}" data-value="${esc(f.value)}">${esc(f.name)}</div>`).join('')}});if(!fonts.length&&q)html+='<div class="font-empty">{{ tr("找不到符合的字型") }}</div>';list.innerHTML=html;list.querySelectorAll('.font-item').forEach(item=>item.onclick=()=>{select.value=item.dataset.value;select.dispatchEvent(new Event('change',{bubbles:true}));wrap.querySelector('.font-cur').textContent=item.textContent;pop.hidden=true})}trigger.onclick=()=>{pop.hidden=!pop.hidden;if(!pop.hidden){draw();search.focus()}};search.oninput=draw;document.addEventListener('click',e=>{if(!wrap.contains(e.target))pop.hidden=true});draw()}
function rowEdit(row,i){const w=data.words[i];return {left:w.left,top:w.top,width:w.width,height:w.height,old_text:w.text,new_text:row.querySelector('.new').value,font_family:row.querySelector('.font').value,font_size:row.querySelector('.size').value,text_color:row.querySelector('.color-auto').checked?'':row.querySelector('.color').value,bold:row.querySelector('.bold').checked}}
function changed(row,i){const e=rowEdit(row,i),w=data.words[i];return e.new_text!==w.text||e.font_family!==''||e.font_size!==''||e.text_color!==''||e.bold}
function collectEdits(){return [...document.querySelectorAll('.ite-row')].map((r,i)=>({r,i})).filter(x=>changed(x.r,x.i)).map(x=>rowEdit(x.r,x.i))}
function mark(row,i){const c=changed(row,i),box=document.querySelector(`.ite-box[data-word="${i}"]`);row.classList.toggle('changed',c);box.classList.toggle('changed',c);row.querySelector('.undo').disabled=!c}
function selectWord(i,focus=true){document.querySelectorAll('.ite-row,.ite-box').forEach(x=>x.classList.remove('active'));const r=document.querySelector(`.ite-row[data-word="${i}"]`),b=document.querySelector(`.ite-box[data-word="${i}"]`);r.classList.add('active');b.classList.add('active');r.scrollIntoView({block:'nearest'});if(focus)r.querySelector('.new').focus()}
function positionBoxes(){const im=$('#preview');if(!data||!im.naturalWidth)return;const sx=im.clientWidth/data.width,sy=im.clientHeight/data.height;document.querySelectorAll('.ite-box').forEach(b=>{const w=data.words[+b.dataset.word];Object.assign(b.style,{left:`${w.left*sx}px`,top:`${w.top*sy}px`,width:`${Math.max(3,w.width*sx)}px`,height:`${Math.max(3,w.height*sy)}px`})})}
function schedule(){clearTimeout(previewTimer);$('#previewState').textContent='{{ tr("預覽更新中…") }}';previewTimer=setTimeout(refresh,400)}async function refresh(){const seq=++previewSeq,fd=new FormData(),edits=collectEdits();fd.append('edits_json',JSON.stringify(edits));const r=await fetch(`/tools/image-text-editor/preview/${uploadId}`,{method:'POST',body:fd});if(!r.ok){$('#previewState').textContent=await err(r,'preview failed');return}const b=await r.blob();if(seq!==previewSeq)return;const u=URL.createObjectURL(b),old=previewUrl;previewUrl=u;$('#preview').src=u;if(old)URL.revokeObjectURL(old);$('#previewState').textContent=edits.length?'{{ tr("修改後預覽") }}':'{{ tr("原始預覽") }}'}
function resetRow(r,i){r.querySelector('.new').value=data.words[i].text;r.querySelector('.font').value='';const picker=r.querySelector('.font-picker');if(picker)picker.querySelector('.font-cur').textContent='Auto';r.querySelector('.size').value='';r.querySelector('.color-auto').checked=true;r.querySelector('.color').disabled=true;r.querySelector('.bold').checked=false;mark(r,i)}
function render(){const stage=document.querySelector('.ite-stage'),root=$('#words'),opts=(data.fonts||[]).map(f=>`<option value="${esc(f.value)}">${esc(f.name)}</option>`).join('');stage.querySelectorAll('.ite-box').forEach(x=>x.remove());root.innerHTML='';data.words.forEach((w,i)=>{const b=document.createElement('div');b.className='ite-box';b.dataset.word=i;b.onclick=()=>selectWord(i);stage.appendChild(b);const r=document.createElement('div');r.className='ite-row';r.dataset.word=i;r.innerHTML=`<div class="ite-main"><input value="${esc(w.text)}" readonly><input class="new" value="${esc(w.text)}"><button class="btn undo" disabled>{{ tr("復原") }}</button></div><div class="ite-style"><label>{{ tr("字型") }} <select class="font"><option value="">Auto</option>${opts}</select></label><label>{{ tr("大小") }} <input class="size ite-size" type="number" min="5" max="300" placeholder="Auto"></label><label><input class="bold" type="checkbox"> {{ tr("粗體") }}</label><label><input class="color-auto" type="checkbox" checked> {{ tr("自動顏色") }}</label><input class="color ite-color" type="color" value="#000000" disabled></div><small>x=${w.left}, y=${w.top}, ${w.width}×${w.height}, conf=${Math.round(w.conf||0)}</small>`;enhanceFontSelect(r.querySelector('.font'));r.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',()=>{if(el.classList.contains('color-auto'))r.querySelector('.color').disabled=el.checked;mark(r,i);schedule()}));r.querySelector('.new').addEventListener('input',()=>{mark(r,i);schedule()});r.querySelector('.new').onfocus=()=>selectWord(i,false);r.querySelector('.undo').onclick=()=>{resetRow(r,i);schedule()};root.appendChild(r)});positionBoxes()}
$('#analyze').onclick=async()=>{const f=$('#imageFile').files[0];if(!f){alert('{{ tr("請選擇圖片") }}');return}$('#status').textContent='{{ tr("上傳並 OCR 分析中…") }}';const fd=new FormData();fd.append('file',f);fd.append('langs',$('#langs').value);const r=await fetch('/tools/image-text-editor/upload',{method:'POST',body:fd});if(!r.ok){$('#status').textContent=await err(r,'upload failed');return}data=await r.json();uploadId=data.upload_id;$('#preview').src=data.preview_url;$('#meta').textContent=`${data.width}×${data.height} · ${data.engine||''} · ${data.words.length} {{ tr("個文字區塊") }}`;$('#editor').hidden=false;$('#actions').hidden=false;render();$('#status').textContent='{{ tr("分析完成") }}'};$('#preview').addEventListener('load',positionBoxes);window.addEventListener('resize',positionBoxes);$('#resetBtn').onclick=()=>{document.querySelectorAll('.ite-row').forEach((r,i)=>resetRow(r,i));schedule()};$('#exportBtn').onclick=async()=>{const fd=new FormData();fd.append('edits_json',JSON.stringify(collectEdits()));const r=await fetch(`/tools/image-text-editor/export/${uploadId}`,{method:'POST',body:fd});if(!r.ok){alert(await err(r,'export failed'));return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='edited-image';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
</script>{% endblock %}
