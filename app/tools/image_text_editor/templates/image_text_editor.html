{% extends "base.html" %}
{% from "components/icons.html" import icon %}
{% block title %}{{ tr('圖片文字編輯') }} · {{ app_name }}{% endblock %}
{% block content %}
<h1>{{ icon('image', size=22) }} {{ tr('圖片文字編輯') }}</h1>
<p class="muted">{{ tr('上傳圖片後自動 OCR 辨識文字；點選文字框修改，會即時產生修改後預覽，並可匯出圖片。') }}</p>
<div class="panel ite-toolbar">
  <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff">
  <label>{{ tr('OCR 語言') }} <input id="langs" value="chi_tra+eng"></label>
  <button class="btn btn-primary" id="analyze">{{ tr('上傳並分析') }}</button>
  <span id="status" class="muted"></span>
</div>
<div class="panel ite-card" id="editor" hidden>
  <div class="ite-preview"><div class="ite-stage"><img id="preview" alt="preview"></div><div class="muted ite-meta"><span id="meta"></span><span id="previewState">{{ tr('原始預覽') }}</span></div></div>
  <div class="ite-words" id="words"></div>
</div>
<div class="panel" id="actions" hidden><button class="btn" id="resetBtn">{{ tr('重設全部修改') }}</button> <button class="btn btn-primary" id="exportBtn">{{ tr('下載修改後圖片') }}</button></div>
<style nonce="{{ request.state.csp_nonce }}">
.ite-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.ite-card{display:grid;grid-template-columns:minmax(280px,1fr) minmax(360px,1fr);gap:16px}.ite-preview{overflow:auto;background:#f8fafc;border:1px solid var(--border);padding:8px}.ite-stage{position:relative;display:inline-block;max-width:100%;line-height:0}.ite-stage img{display:block;max-width:100%;height:auto}.ite-box{position:absolute;box-sizing:border-box;border:2px solid #2563eb;background:rgba(37,99,235,.08);cursor:pointer;min-width:3px;min-height:3px}.ite-box:hover,.ite-box.active{border-width:3px;background:rgba(37,99,235,.18);z-index:2}.ite-box.changed{border-color:#ea580c;background:rgba(234,88,12,.14)}.ite-meta{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.ite-words{max-height:650px;overflow:auto}.ite-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--border);padding:6px}.ite-row small{grid-column:1/-1;color:#64748b}.ite-row.active{outline:2px solid #2563eb;outline-offset:-2px;background:rgba(37,99,235,.06)}.ite-row.changed{background:rgba(234,88,12,.06)}.ite-undo:disabled{opacity:.45}@media(max-width:900px){.ite-card{grid-template-columns:1fr}}
</style>
<script nonce="{{ request.state.csp_nonce }}">
let uploadId=null,data=null,previewTimer=null,previewUrl=null,previewSeq=0;
const $=s=>document.querySelector(s);
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function collectEdits(){let edits=[];document.querySelectorAll('.ite-row').forEach((row,i)=>{if(row.dataset.changed==='1'){const w=data.words[i];edits.push({left:w.left,top:w.top,width:w.width,height:w.height,old_text:w.text,new_text:row.querySelector('.new').value})}});return edits}
function selectWord(i,focus=true){document.querySelectorAll('.ite-row,.ite-box').forEach(x=>x.classList.remove('active'));const row=document.querySelector(`.ite-row[data-word="${i}"]`),box=document.querySelector(`.ite-box[data-word="${i}"]`);if(row){row.classList.add('active');row.scrollIntoView({block:'nearest'});if(focus)row.querySelector('.new').focus()}if(box)box.classList.add('active')}
function setChanged(row,box,w){const changed=row.querySelector('.new').value!==w.text;row.dataset.changed=changed?'1':'0';row.classList.toggle('changed',changed);box.classList.toggle('changed',changed);box.title=row.querySelector('.new').value;row.querySelector('.ite-undo').disabled=!changed}
function positionBoxes(){const img=$('#preview');if(!data||!img.naturalWidth||!data.width||!data.height)return;const sx=img.clientWidth/data.width,sy=img.clientHeight/data.height;document.querySelectorAll('.ite-box').forEach(box=>{const w=data.words[Number(box.dataset.word)];box.style.left=`${w.left*sx}px`;box.style.top=`${w.top*sy}px`;box.style.width=`${Math.max(3,w.width*sx)}px`;box.style.height=`${Math.max(3,w.height*sy)}px`})}
function schedulePreview(){clearTimeout(previewTimer);$('#previewState').textContent='{{ tr("預覽更新中…") }}';previewTimer=setTimeout(refreshPreview,400)}
async function refreshPreview(){const seq=++previewSeq,edits=collectEdits(),fd=new FormData();fd.append('edits_json',JSON.stringify(edits));try{const r=await fetch(`/tools/image-text-editor/preview/${uploadId}`,{method:'POST',body:fd});if(!r.ok){const d=await r.json();throw new Error(d.detail||'preview failed')}const blob=await r.blob();if(seq!==previewSeq)return;const url=URL.createObjectURL(blob),old=previewUrl;previewUrl=url;$('#preview').src=url;if(old)URL.revokeObjectURL(old);$('#previewState').textContent=edits.length?'{{ tr("修改後預覽") }}':'{{ tr("原始預覽") }}'}catch(e){if(seq===previewSeq)$('#previewState').textContent=`{{ tr("預覽失敗") }}: ${e.message}`}}
function render(){const stage=document.querySelector('.ite-stage'),root=$('#words');stage.querySelectorAll('.ite-box').forEach(x=>x.remove());root.innerHTML='';data.words.forEach((w,i)=>{const box=document.createElement('div');box.className='ite-box';box.dataset.word=i;box.title=w.text;box.onclick=()=>selectWord(i);stage.appendChild(box);const row=document.createElement('div');row.className='ite-row';row.dataset.word=i;row.dataset.changed='0';row.innerHTML=`<input value="${esc(w.text)}" readonly><input class="new" value="${esc(w.text)}"><button type="button" class="btn ite-undo" disabled>{{ tr("復原") }}</button><small>x=${w.left}, y=${w.top}, ${w.width}×${w.height}, conf=${Math.round(w.conf||0)}</small>`;const input=row.querySelector('.new'),undo=row.querySelector('.ite-undo');input.onfocus=()=>selectWord(i,false);input.oninput=()=>{setChanged(row,box,w);schedulePreview()};undo.onclick=()=>{input.value=w.text;setChanged(row,box,w);selectWord(i,false);schedulePreview()};root.appendChild(row)});positionBoxes()}
$('#analyze').onclick=async()=>{const f=$('#imageFile').files[0];if(!f){alert('{{ tr("請選擇圖片") }}');return}if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null}$('#status').textContent='{{ tr("上傳並 OCR 分析中…") }}';const fd=new FormData();fd.append('file',f);fd.append('langs',$('#langs').value);const r=await fetch('/tools/image-text-editor/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok){$('#status').textContent=d.detail||'upload failed';return}uploadId=d.upload_id;data=d;$('#preview').src=d.preview_url;$('#meta').textContent=`${d.width}×${d.height} · ${d.engine||''} · ${d.words.length} {{ tr("個文字區塊") }}`;$('#previewState').textContent='{{ tr("原始預覽") }}';$('#editor').hidden=false;$('#actions').hidden=false;render();$('#status').textContent='{{ tr("分析完成") }}'};
$('#preview').addEventListener('load',positionBoxes);window.addEventListener('resize',positionBoxes);
$('#resetBtn').onclick=()=>{document.querySelectorAll('.ite-row').forEach((row,i)=>{const w=data.words[i],box=document.querySelector(`.ite-box[data-word="${i}"]`);row.querySelector('.new').value=w.text;setChanged(row,box,w);row.classList.remove('active');box.classList.remove('active')});schedulePreview()};
$('#exportBtn').onclick=async()=>{const fd=new FormData();fd.append('edits_json',JSON.stringify(collectEdits()));const r=await fetch(`/tools/image-text-editor/export/${uploadId}`,{method:'POST',body:fd});if(!r.ok){const d=await r.json();alert(d.detail||'export failed');return}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);const cd=r.headers.get('content-disposition')||'';const m=cd.match(/filename\*?=(?:UTF-8''|\")?([^\";]+)/i);a.download=m?decodeURIComponent(m[1]):'edited-image';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
</script>
{% endblock %}
