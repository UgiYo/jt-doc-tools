# 每次 push / PR 跑測試。
# CI trigger note: feature branches are intentionally validated on every push.
#
# * core —— 不需要 LibreOffice / OCR 模型的部分，每次 push 都跑。
# * raster-editor —— 圖片文字編輯 / PPT 圖片文字編輯共用 raster pipeline 的回歸測試。
# * office —— 要裝 LibreOffice 與中日韓字型，只在 PR、每日排程或手動完整執行時跑。
name: tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_office:
        description: '同時執行 LibreOffice / CJK 完整測試'
        required: false
        default: false
        type: boolean
  schedule:
    # 每日台北時間 09:00（01:00 UTC）。
    - cron: '0 1 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 核心測試（不需 Office / OCR）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝中日韓字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: 匯入 smoke test
        run: python -c "import fastapi, fitz, ldap3, jwt, PIL, httpx"
      - name: 版本一致性
        run: python tools/check_version_consistency.py
      - name: 文件與工具涵蓋
        run: python tools/check_docs_tool_coverage.py
      - name: pytest（排除需要 Office / OCR 的）
        run: |
          set +e
          pytest -q --deselect tests/test_pdf_to_slides.py \
                    --deselect tests/test_office_convert.py \
                    -p no:cacheprovider > /tmp/pytest.out 2>&1
          code=$?
          tail -60 /tmp/pytest.out
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/pytest.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

  raster-editor:
    name: 圖片 / PPT 圖片編輯回歸測試
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 renderer 測試相依
        run: |
          python -m pip install --upgrade pip
          pip install Pillow pytest
      - name: 安裝 CJK 字型
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 共用 raster renderer 回歸測試
        run: pytest -q -p no:cacheprovider tests/test_raster_overlay_editor.py
      - name: 前端共用編輯器 JavaScript 語法檢查
        run: node --check static/js/raster_overlay_editor.js

  security:
    name: 資安測試
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit
      - name: OWASP / 越權 / CSRF / SSRF / path traversal
        run: |
          set +e
          pytest -q -p no:cacheprovider \
            tests/test_owasp_top10.py \
            tests/test_authz_boundaries.py \
            tests/test_llm_url_ssrf.py \
            tests/test_path_traversal_audit.py \
            tests/test_open_redirect.py \
            tests/test_id_from_body_acl.py \
            tests/test_csv_injection.py \
            tests/test_broken_input_no_500.py > /tmp/sec.out 2>&1
          code=$?
          tail -60 /tmp/sec.out
          if [ $code -ne 0 ]; then
            grep -E '^(FAILED|ERROR)' /tmp/sec.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code
      - name: bandit（Medium 以上、高信心）
        run: |
          set +e
          bandit -r app -ll -iii -q > /tmp/bandit.out 2>&1
          code=$?
          cat /tmp/bandit.out
          if [ $code -ne 0 ]; then
            grep -E '^>> Issue' /tmp/bandit.out | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $code

  office:
    name: 轉檔測試（LibreOffice + 中日韓字型）
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_office)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 LibreOffice 與字型
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            libreoffice-draw fonts-noto-cjk fonts-noto-cjk-extra
      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: pytest（轉檔相關）
        run: |
          pytest -q -p no:cacheprovider \
            tests/test_office_convert.py \
            tests/test_pdf_to_slides.py \
            tests/test_cjk_font_renders.py
